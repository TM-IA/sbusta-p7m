name: build-android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # No Gradle wrapper committed yet (no local Gradle/JDK available
      # to generate gradle-wrapper.jar in the session that wrote this
      # project) — using the runner's own preinstalled Gradle directly.
      - name: Unit tests (JVM, no emulator)
        run: gradle test --no-daemon

      - name: Decode release keystore
        run: |
          set -eu
          echo "$SBUSTA_P7M_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sbusta-p7m-release.jks"
        env:
          SBUSTA_P7M_KEYSTORE_BASE64: ${{ secrets.SBUSTA_P7M_KEYSTORE_BASE64 }}

      - name: Build release APK (signed)
        run: gradle assembleRelease --no-daemon
        env:
          SBUSTA_P7M_KEYSTORE_PATH: ${{ runner.temp }}/sbusta-p7m-release.jks
          SBUSTA_P7M_KEYSTORE_PASSWORD: ${{ secrets.SBUSTA_P7M_KEYSTORE_PASSWORD }}

      # One-off diagnostic: print every merged manifest copy Gradle
      # produced, to see the actual (post-merge) <uses-permission>
      # list — a permission can be added by a dependency's own AAR
      # manifest without our AndroidManifest.xml mentioning it.
      - name: Show merged manifest
        run: find app/build/intermediates -iname "AndroidManifest.xml" -exec sh -c 'echo "--- {} ---"; cat "{}"' \;

      - uses: actions/upload-artifact@v4
        with:
          name: sbusta-p7m-android-release
          path: android-app/app/build/outputs/apk/release/*.apk
