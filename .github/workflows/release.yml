name: release
run-name: "release ${{ github.ref_name }}${{ github.event_name == 'workflow_dispatch' && format(' (test: {0})', inputs.version) || '' }}"

# Builds all three platforms (reusing build-linux.yml/build-android.yml/
# build-macos.yml as reusable workflows via workflow_call, no duplicated
# build logic) and attaches the results to a GitHub Release.
#
# Two ways to run it:
# - Push a tag matching v* (e.g. v0.3.0): builds, then publishes a real,
#   non-draft release tagged with that name.
# - workflow_dispatch with a version input: same build, but publishes a
#   DRAFT release instead (doesn't create a real git tag until a human
#   reviews and publishes it from the GitHub UI) — for testing this
#   pipeline itself without polluting the repo's tag list.
#
# Known gap: only the macOS build's version string (-V) is driven by
# this workflow's computed version. Android's versionName/versionCode
# and pyproject.toml's version are each independent, pre-existing
# values not synchronized to the release tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.2.1) — for a manual/test run; a real tag push derives it from the tag name instead'
        type: string
        required: true

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, needed for an accurate commit count

      - name: Compute version string
        id: compute
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Test/draft run: never a "real" version, so always suffix
            # with the commit count — repeated test dispatches get a
            # unique version without colliding with each other or with
            # a real release, no manual bookkeeping needed.
            count=$(git rev-list --count HEAD)
            v="${{ inputs.version }}+${count}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Fail if this version was already released
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if gh release view "v${{ steps.compute.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "error: release v${{ steps.compute.outputs.version }} already exists" >&2
            exit 1
          fi

  build-linux:
    needs: version
    uses: ./.github/workflows/build-linux.yml

  build-android:
    needs: version
    uses: ./.github/workflows/build-android.yml
    secrets: inherit

  build-macos:
    needs: version
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, build-linux, build-android, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: List downloaded assets
        run: find dist -type f

      - name: Publish release
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          body: |
            - Linux (x86_64, aarch64): tarball autonomo
            - Android: APK firmato
            - macOS: .app universal2 (non firmato — vedi README per la rimozione quarantena)
          generate_release_notes: true
          name: v${{ needs.version.outputs.version }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          files: |
            dist/**/*.tar.gz
            dist/**/*.apk
            dist/**/*.zip
