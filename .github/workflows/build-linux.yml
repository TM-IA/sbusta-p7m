name: build-linux

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'sbusta_p7m/**'
      - 'linux-launcher/**'
      - 'build-linux/**'
      - '.github/workflows/build-linux.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build
        run: ./build-linux/build.sh

      # Validates the actual built binary against a real (synthetically
      # signed) CMS envelope, not just that PyInstaller succeeded —
      # same technique used locally for the macOS build (openssl cms
      # -sign with a throwaway self-signed cert).
      - name: Smoke test the built CLI
        run: |
          set -eu
          printf '%%PDF-1.4\ntest content\n' > /tmp/test.pdf
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/key.pem -out /tmp/cert.pem \
              -days 1 -nodes -subj "/CN=CI Test Signer/O=sbusta-p7m CI"
          openssl cms -sign -in /tmp/test.pdf -signer /tmp/cert.pem -inkey /tmp/key.pem \
              -outform DER -binary -nodetach -out /tmp/test.p7m
          PKG_DIR="build-linux/dist/sbusta-p7m-linux-${{ matrix.arch }}"
          "$PKG_DIR/sbusta-p7m" /tmp/test.p7m -d /tmp/out
          test -f /tmp/out/test/test.pdf
          test -f /tmp/out/test/test.json
          grep -q "CI Test Signer" /tmp/out/test/test.json
          echo "smoke test OK"

      - name: Smoke test the fallback path (destination not writable)
        run: |
          set -eu
          mkdir -p /tmp/readonly
          chmod 000 /tmp/readonly
          FALLBACK="$HOME/.local/share/sbusta-p7m/estrazioni-fallback"
          rm -rf "$FALLBACK"
          PKG_DIR="build-linux/dist/sbusta-p7m-linux-${{ matrix.arch }}"
          output=$("$PKG_DIR/sbusta-p7m" /tmp/test.p7m -d /tmp/readonly)
          echo "$output" | grep -q "^fallback: $FALLBACK\$"
          test -f "$FALLBACK/test/test.pdf"
          test -f "$FALLBACK/test/test.json"
          chmod 755 /tmp/readonly
          echo "smoke test fallback OK"

      - name: Smoke test co-signers (several SignerInfo in one layer)
        run: |
          set -eu
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/key2.pem -out /tmp/cert2.pem \
              -days 1 -nodes -subj "/CN=CI Test Cosigner/O=sbusta-p7m CI"
          openssl cms -sign -in /tmp/test.pdf -signer /tmp/cert.pem -inkey /tmp/key.pem \
              -outform DER -binary -nodetach -out /tmp/step1.p7m
          openssl cms -resign -in /tmp/step1.p7m -inform DER \
              -signer /tmp/cert2.pem -inkey /tmp/key2.pem \
              -outform DER -binary -nodetach -out /tmp/cofirmato.p7m
          PKG_DIR="build-linux/dist/sbusta-p7m-linux-${{ matrix.arch }}"
          "$PKG_DIR/sbusta-p7m" /tmp/cofirmato.p7m -d /tmp/out-cofirmato
          python3 -c "
          import json
          d = json.load(open('/tmp/out-cofirmato/cofirmato/cofirmato.json'))
          assert len(d['firmatari']) == 2, d['firmatari']
          cn = sorted(f['cn'] for f in d['firmatari'])
          assert cn == ['CI Test Cosigner', 'CI Test Signer'], cn
          assert all(f['livello'] == 0 for f in d['firmatari'])
          "
          echo "smoke test co-firmatari OK"

      - name: Smoke test the hidden preferences contract
        run: |
          set -eu
          PKG_DIR="build-linux/dist/sbusta-p7m-linux-${{ matrix.arch }}"
          BIN="$PKG_DIR/sbusta-p7m"
          [ "$("$BIN" --get-preferenza log)" = "on" ]
          [ -z "$("$BIN" --get-preferenza destinazione)" ]
          "$BIN" --set-preferenza destinazione /tmp/una-cartella
          [ "$("$BIN" --get-preferenza destinazione)" = "/tmp/una-cartella" ]
          "$BIN" --set-preferenza log off
          [ "$("$BIN" --get-preferenza log)" = "off" ]
          "$BIN" --set-preferenza destinazione ""
          [ -z "$("$BIN" --get-preferenza destinazione)" ]
          "$BIN" --set-preferenza modalita Cartella
          [ "$("$BIN" --get-preferenza modalita)" = "Cartella" ]
          if "$BIN" --help | grep -qi "preferenza"; then
              echo "i flag nascosti non devono comparire in --help" >&2
              exit 1
          fi
          echo "smoke test preferenze OK"

      - name: Check package contents
        run: |
          set -eu
          PKG_DIR="build-linux/dist/sbusta-p7m-linux-${{ matrix.arch }}"
          for f in sbusta-p7m wrapper.sh help/index.html help/index.txt sbusta-p7m.desktop install.sh uninstall.sh icon.png; do
              test -f "$PKG_DIR/$f" || { echo "manca $f nel pacchetto" >&2; exit 1; }
          done
          echo "struttura pacchetto OK"

      - uses: actions/upload-artifact@v4
        with:
          name: sbusta-p7m-linux-${{ matrix.arch }}
          path: build-linux/dist/sbusta-p7m-linux-${{ matrix.arch }}.tar.gz
