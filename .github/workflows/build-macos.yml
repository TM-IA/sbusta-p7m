name: build-macos

# Builds the macOS .app entirely on a GitHub-hosted runner. Callable
# standalone (workflow_dispatch, for a quick regression check) or as a
# step of release.yml (workflow_call).
#
# - sveinbjornt/setup-platypus installs the Platypus CLI via
#   `sudo bash InstallCommandLineTool.sh`; works non-interactively
#   because GitHub-hosted macOS runners have passwordless sudo by
#   default (runner ALL=(root) NOPASSWD:ALL in /etc/sudoers.d/runner).
# - actions/setup-python's macOS builds may not be universal2, so this
#   downloads the official python.org universal2 installer directly
#   instead, same requirement build-macos/build.sh documents for a
#   local build.
# - PyInstaller's direct --target-arch universal2 needs every wheel
#   involved to itself be (or resolve to) universal2; if a dependency
#   only ships thin wheels, that build can fail even with a universal2
#   Python. Fallback: build arm64 and x86_64 separately, merge with
#   `lipo`.
#
# build-macos/build.sh (the local-build path) and README still
# describe a local-only build; not updated here.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string for -V (e.g. 0.2.0)'
        type: string
        required: false
        default: '0.0.0-dev'
  workflow_call:
    inputs:
      version:
        description: 'Version string for -V (e.g. from a release tag)'
        type: string
        required: false
        default: '0.0.0-dev'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Platypus command line tool
        # No tags/releases exist on this repo (only a `master` branch),
        # so pinned to a commit SHA instead of a version tag for
        # reproducibility.
        uses: sveinbjornt/setup-platypus@56e4eea1fc77eaf4b32c379ff2f26a5f3ba52ac5
        with:
          version: '5.5.0'

      - name: Verify Platypus CLI
        run: platypus -v

      - name: Install universal2 Python from python.org
        run: |
          set -eu
          PY_VERSION="3.13.15"
          curl -fsSL -o python.pkg \
              "https://www.python.org/ftp/python/${PY_VERSION}/python-${PY_VERSION}-macos11.pkg"
          sudo installer -pkg python.pkg -target /
          echo "PYBIN=/Library/Frameworks/Python.framework/Versions/3.13/bin/python3" >> "$GITHUB_ENV"

      - name: Verify the installed Python is actually universal2
        run: |
          set -eu
          "$PYBIN" --version
          file "$PYBIN"
          # Expect two architectures (x86_64 and arm64) in the output.
          file "$PYBIN" | grep -q "2 architectures" || {
              echo "error: installed Python is not universal2" >&2
              exit 1
          }

      - name: Build PyInstaller (universal2, arm64+x86_64/lipo fallback)
        run: |
          set -eu
          "$PYBIN" -m venv .venv-build-macos
          .venv-build-macos/bin/pip install --upgrade pip
          .venv-build-macos/bin/pip install asn1crypto pyinstaller

          # $1: --target-arch value, $2: PyInstaller --name (and output
          # filename under build-macos/dist/).
          build_arch() {
              .venv-build-macos/bin/pyinstaller \
                  --name "$2" \
                  --onefile \
                  --target-arch "$1" \
                  --paths . \
                  --distpath build-macos/dist \
                  --workpath "build-macos/work-$2" \
                  --specpath build-macos \
                  --noconfirm \
                  build-macos/entry.py
          }

          if build_arch universal2 sbusta-p7m; then
              echo "build universal2 diretto riuscito"
          else
              echo "build universal2 diretto fallito: ripiego su arm64 + x86_64 separati, poi lipo"
              build_arch arm64 sbusta-p7m-arm64
              build_arch x86_64 sbusta-p7m-x86_64
              lipo -create -output build-macos/dist/sbusta-p7m \
                  build-macos/dist/sbusta-p7m-arm64 \
                  build-macos/dist/sbusta-p7m-x86_64
          fi

      - name: Verify the built CLI is a universal2 binary
        run: |
          set -eu
          file build-macos/dist/sbusta-p7m
          file build-macos/dist/sbusta-p7m | grep -q "2 architectures" || {
              echo "error: PyInstaller executable is not universal2" >&2
              exit 1
          }

      - name: Rebuild Help Book search index
        run: |
          set -eu
          cd "macos-launcher/sbusta-p7m Help.help/Contents/Resources/it.lproj"
          hiutil -Cf "sbusta-p7m Help.helpindex" .

      - name: Wrap with Platypus
        run: |
          set -eu
          platypus \
              -a "sbusta-p7m" \
              -o "None" \
              -p /bin/sh \
              -D \
              -X "p7m" \
              -f build-macos/dist/sbusta-p7m \
              -f "macos-launcher/sbusta-p7m Help.help" \
              -i "macos-launcher/AppIcon.icns" \
              -u "TM-IA" \
              -V "${{ inputs.version }}" \
              -I "com.tm-ia.sbusta-p7m" \
              -y \
              macos-launcher/wrapper.sh \
              build-macos/dist/sbusta-p7m.app

      - name: Register Help Book in Info.plist
        # Not exposed as a platypus CLI flag, same as
        # build-macos/build.sh's own step 4 — a separate
        # post-processing step. CFBundleHelpBookName is what the
        # system's native Aiuto menu uses to find this Help Book.
        run: |
          set -eu
          PLIST="build-macos/dist/sbusta-p7m.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleHelpBookFolder" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :CFBundleHelpBookName" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleHelpBookFolder string 'sbusta-p7m Help.help'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleHelpBookName string 'com.tm-ia.sbusta-p7m.help'" "$PLIST"

      - name: Verify the .app bundle
        run: |
          set -eu
          test -d build-macos/dist/sbusta-p7m.app
          test -x "build-macos/dist/sbusta-p7m.app/Contents/Resources/sbusta-p7m"
          test -d "build-macos/dist/sbusta-p7m.app/Contents/Resources/sbusta-p7m Help.help"
          file "build-macos/dist/sbusta-p7m.app/Contents/Resources/sbusta-p7m"
          echo ".app costruito interamente in CI, Help Book incluso"

      - name: Zip the .app bundle (ditto preserves the .app folder name)
        # actions/upload-artifact uploads a given folder's *contents*,
        # not the folder itself — pointing it straight at
        # build-macos/dist/sbusta-p7m.app would drop the ".app"-named
        # wrapper folder from the downloaded artifact. Zipping the
        # bundle ourselves with ditto (Apple's own tool for this,
        # preserves resource forks/xattrs a generic zip can lose) keeps
        # the folder name intact inside the artifact.
        run: |
          set -eu
          ditto -c -k --sequesterRsrc --keepParent \
              build-macos/dist/sbusta-p7m.app \
              build-macos/dist/sbusta-p7m.app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: sbusta-p7m-macos
          path: build-macos/dist/sbusta-p7m.app.zip
